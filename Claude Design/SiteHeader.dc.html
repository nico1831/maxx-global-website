<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}" style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px clamp(12px,3.5vw,24px);padding:8px 10px 8px clamp(14px,4vw,26px);border-radius:100px;background:rgba(18,18,18,.72);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.5);font-family:Manrope,system-ui,sans-serif;position:relative">
  <a href="Home.dc.html" style="display:flex;align-items:center;flex:none;transition:filter .2s ease;filter:{{ logoFilter }}"><img src="uploads/logo.png" alt="Maxx Global Resources" style="height:clamp(28px,7vw,38px);display:block"></a>

  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;gap:clamp(16px,2vw,28px);align-items:center">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="{{ n.style }}">{{ n.label }}</a>
      </sc-for>
    </nav>
    <a href="Contact.dc.html" style="background:#d92632;color:#fff;border-radius:100px;padding:12px 24px;font:600 13.5px Manrope,sans-serif;text-decoration:none;white-space:nowrap;flex:none" style-hover="background:#e63e49">Request a Quote</a>
  </sc-if>

  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:10px;flex:none">
      <a href="Contact.dc.html" style="background:#d92632;color:#fff;border-radius:100px;padding:11px 18px;font:600 13px Manrope,sans-serif;text-decoration:none;white-space:nowrap">Get a Quote</a>
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0">
        <span style="{{ bar1 }}"></span>
        <span style="{{ bar2 }}"></span>
        <span style="{{ bar3 }}"></span>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:calc(100% + 10px);left:0;right:0;background:rgba(16,16,16,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:10px;display:flex;flex-direction:column">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="{{ n.mobileStyle }}">{{ n.label }}</a>
      </sc-for>
    </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:92},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Catalog&quot;,&quot;Brands&quot;,&quot;Solutions&quot;,&quot;Projects&quot;,&quot;About&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { hover: false, menu: false, w: typeof window !== "undefined" ? window.innerWidth : 1440 };

  componentDidMount() {
    this._onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener("resize", this._onResize);
    this._onResize();
  }
  componentWillUnmount() { window.removeEventListener("resize", this._onResize); }

  renderVals() {
    const items = [
      ["Catalog", "Catalog.dc.html"],
      ["Brands", "Brands.dc.html"],
      ["Solutions", "Solutions.dc.html"],
      ["Projects", "Projects.dc.html"],
      ["About", "About.dc.html"],
      ["Contact", "Contact.dc.html"],
    ];
    const active = this.props.active || "";
    const wide = this.state.w >= 900;
    const bar = "width:17px;height:1.5px;border-radius:2px;background:#f2f2f0;transition:transform .18s ease,opacity .18s ease";
    return {
      wide,
      narrow: !wide,
      menuOpen: !wide && this.state.menu,
      logoFilter: this.state.hover ? "none" : "brightness(0) invert(1)",
      onEnter: () => this.setState({ hover: true }),
      onLeave: () => this.setState({ hover: false }),
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      bar1: bar + (this.state.menu ? ";transform:translateY(5.5px) rotate(45deg)" : ""),
      bar2: bar + (this.state.menu ? ";opacity:0" : ""),
      bar3: bar + (this.state.menu ? ";transform:translateY(-5.5px) rotate(-45deg)" : ""),
      nav: items.map(([label, href]) => ({
        label, href,
        style: "font:600 13.5px Manrope,sans-serif;text-decoration:none;white-space:nowrap;color:" +
          (label === active ? "#fff" : "#a8a8a4"),
        mobileStyle: "display:block;padding:15px 18px;border-radius:14px;font:600 16px Manrope,sans-serif;text-decoration:none;color:" +
          (label === active ? "#fff" : "#c9c9c6") +
          ";background:" + (label === active ? "rgba(255,255,255,.07)" : "transparent"),
      })),
    };
  }
}
</script>
</body>
</html>
